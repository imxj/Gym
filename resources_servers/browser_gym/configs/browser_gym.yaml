browser_gym_resources_server:
  resources_servers:
    browser_gym:
      entrypoint: app.py
      domain: agent
      description: Browser-based CUA environment using Playwright. Models interact with live web pages via screenshots and actions (click, type, scroll, keypress).
      value: Improve computer-use and web navigation capabilities
      max_concurrent_browsers: ${max_concurrent_browsers}
      browser_pool_size: ${browser_pool_size}
      default_viewport_width: 1280
      default_viewport_height: 720
      verified: false
browser_gym_openai_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://inference-api.nvidia.com
      openai_api_key: ${cua_openai_api_key}
      openai_model: openai/openai/gpt-5.4
      openai_organization: ${cua_openai_org}
browser_gym_anthropic_sonnet_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://inference-api.nvidia.com
      openai_api_key: ${cua_openai_api_key}
      openai_model: azure/anthropic/claude-sonnet-4-6
      openai_organization: ${cua_openai_org}
browser_gym_anthropic_opus_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://inference-api.nvidia.com
      openai_api_key: ${cua_openai_api_key}
      openai_model: aws/anthropic/bedrock-claude-opus-4-6
      openai_organization: ${cua_openai_org}
browser_openai_agent:
  responses_api_agents:
    browser_agent:
      entrypoint: app.py
      cua_adapter_type: vision
      cua_model: openai/openai/gpt-5.4
      max_steps: 250
      viewport_width: 1280
      viewport_height: 720
      cua_debug_trajectories: ${cua_debug_trajectories}
      cua_debug_output_dir: results/cua_debug_trajectories
      resources_server:
        type: resources_servers
        name: browser_gym_resources_server
      model_server:
        type: responses_api_models
        name: browser_gym_openai_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/browser_gym/data/example.jsonl
        num_repeats: 1
        license: Apache 2.0
